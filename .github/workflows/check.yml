name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generated VS Code, Zed and Neovim output is up to date
        run: npm run check
      - name: Validate Zed theme against the vendored schema
        run: npm run check:zed-schema
      - name: Validate Zed theme against the published schema
        run: |
          schema="$RUNNER_TEMP/zed-theme-schema.json"
          curl -sSfL https://zed.dev/schema/themes/v0.2.0.json -o "$schema"
          spec=$(node -p "String(require('$schema').\$schema).includes('2020-12') ? 'draft2020' : 'draft7'")
          npx --yes ajv-cli@5.0.0 validate --spec="$spec" --strict=false -s "$schema" -d zed/themes/oxocarbon-grey.json
      - name: Package
        run: npx --yes @vscode/vsce package
      - name: Check the VSIX leaves out the Zed and Neovim ports, the website and build sources
        run: |
          set -o pipefail
          vsix=(*.vsix)
          test ${#vsix[@]} -eq 1
          files=$(unzip -Z1 "${vsix[0]}")
          if grep -E '^extension/(zed|colors|lua|tests|src|fixtures|site)/' <<< "$files"; then
            echo "VSIX contains files that belong to the Zed or Neovim ports, the website or the build"
            exit 1
          fi

  neovim:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [v0.10.4, v0.11.7, v0.12.5]
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim ${{ matrix.version }}
        run: |
          curl -sSfL https://github.com/neovim/neovim/releases/download/${{ matrix.version }}/nvim-linux-x86_64.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - run: nvim --version
      - name: Run headless Neovim tests
        run: npm run test:neovim
      - name: Check fixture highlighting and website specimens with pinned parsers
        if: matrix.version == 'v0.12.5'
        run: npm run test:neovim:fixtures
