name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generated VS Code and Zed themes are up to date
        run: npm run check
      - name: Validate Zed theme against the vendored schema
        run: npm run check:zed-schema
      - name: Validate Zed theme against the published schema
        run: |
          curl -sSfL https://zed.dev/schema/themes/v0.2.0.json -o "$RUNNER_TEMP/zed-theme-schema.json"
          npx --yes ajv-cli@5.0.0 validate --spec=draft2020 --strict=false -s "$RUNNER_TEMP/zed-theme-schema.json" -d zed/themes/oxocarbon-grey.json
      - name: Package
        run: npx --yes @vscode/vsce package
      - name: Check the VSIX leaves out the Zed extension and build sources
        run: |
          if unzip -l *.vsix | grep -E ' extension/(zed|src|fixtures)/'; then
            echo "VSIX contains files that belong to the Zed extension or the build"
            exit 1
          fi
